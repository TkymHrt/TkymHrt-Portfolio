name: Lighthouse CI
on:
  push:
jobs:
  lhci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lighthouse CI
        run: pnpm dlx @lhci/cli autorun
        env:
          # セルフホストLHCIサーバーのプロジェクト用トークン
          LHCI_TOKEN: ${{ secrets.LHCI_TOKEN }}
          # lighthouserc.jsでserverBaseUrlを設定している場合は不要ですが、
          # ここで環境変数として上書きすることも可能です。
          # LHCI_SERVER_BASE_URL: ${{ secrets.LHCI_SERVER_BASE_URL }}
